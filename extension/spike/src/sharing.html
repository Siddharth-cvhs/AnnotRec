<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>AnnotRec is sharing</title>
<link rel="stylesheet" href="ui.css" />
<style>
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; overflow: hidden; background: var(--card); }
  .note { display: flex; align-items: center; gap: 12px; padding: 10px 16px; animation: pop .35s var(--ease) both; transition: opacity .45s var(--ease), transform .45s var(--ease); }
  .note.out { opacity: 0; transform: translateY(-6px); }
  .ring { position: relative; width: 14px; height: 14px; flex: none; }
  .ring i { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); }
  .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ring 1.6s var(--ease) infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .6; } to { transform: scale(2.6); opacity: 0; } }
  b { display: block; font-size: 13px; font-weight: 650; }
  small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
</style>
</head>
<body>
<div id="note" class="note"><span class="ring"><i></i></span><span><b id="t">Sharing</b><small id="s"></small></span></div>
<script src="sharing.js"></script>
</body>
</html>
