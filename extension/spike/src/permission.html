<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnnotRec: microphone permission</title>
<style>
  :root { color-scheme: dark; font: 15px "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16181d; color: #e8eaf0; }
  main { width: min(520px, 92vw); background: #1f232b; border: 1px solid #2f3541; border-radius: 14px; padding: 26px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 18px; }
  p { margin: 0; line-height: 1.5; color: #b6bdcc; }
  .ok { color: #7ee2a0; } .bad { color: #ffb4b8; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, a.btn { background: #2a303b; color: inherit; border: 1px solid #343b4a; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; text-decoration: none; }
  button.primary { background: #3f72f0; border-color: #3f72f0; }
  ol { margin: 0; padding-left: 20px; color: #b6bdcc; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🎙 AnnotRec needs your microphone</h1>
  <p id="msg">Your browser will ask for permission now. Choose <b>Allow</b>.</p>
  <div id="fix" hidden>
    <ol id="steps"></ol>
  </div>
  <div class="row">
    <button id="retry" class="primary">Try again</button>
    <button id="browsersettings" hidden>Open browser microphone settings</button>
    <a id="win" class="btn" href="ms-settings:privacy-microphone" target="_blank" hidden>Open Windows microphone settings</a>
  </div>
</main>
<script src="browser-info.js"></script>
<script src="permission.js"></script>
</body>
</html>
