<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnnotRec</title>
<style>
  :root { color-scheme: dark; font: 13px "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; padding: 12px; background: #16181d; color: #e8eaf0; display: grid; gap: 10px; }
  h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 small { font: 600 10px monospace; color: #5b8cff; background: rgba(91,140,255,.15); padding: 2px 6px; border-radius: 99px; }
  section { background: #1f232b; border: 1px solid #2f3541; border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  h2 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6f788b; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #2a303b; color: inherit; border: 1px solid #343b4a; border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #343b49; }
  button.rec { background: #ff4d57; border-color: #ff4d57; font-weight: 600; }
  button.primary { background: #3f72f0; border-color: #3f72f0; }
  #status { font: 12px monospace; color: #a4acbd; white-space: pre-wrap; }
  #err { color: #ffb4b8; }
  a { color: #93c5fd; }
  #tools button { flex: 1 1 30%; }
  #tools button.on { background: #3f72f0; border-color: #3f72f0; }
  .sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .sw.on { border-color: #fff; }
  .size { align-items: center; } .size input { flex: 1; }
  button:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .chip { padding: 3px 9px; border-radius: 99px; background: #2a303b; color: #a4acbd; }
  .chip.ok { background: rgba(34,197,94,.16); color: #7ee2a0; } .chip.bad { background: rgba(239,68,68,.18); color: #ffb4b8; }
  .help { background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.35); border-radius: 8px; padding: 9px; display: grid; gap: 8px; font-size: 12px; line-height: 1.5; }
  .help[hidden] { display: none; }
  a.btn { background: #2a303b; border: 1px solid #343b4a; border-radius: 8px; padding: 7px 10px; color: inherit; text-decoration: none; }
  .folder { font: 11px monospace; color: #a4acbd; word-break: break-all; }
  li { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 3px 0; }
  li button { padding: 2px 8px; font-size: 11px; }
  ul { margin: 0; padding-left: 18px; font-size: 12px; }
</style>
</head>
<body>
  <h1>AnnotRec <small>extension spike</small></h1>

  <section>
    <h2>1 · Set up (once)</h2>
    <div class="row">
      <button id="pick" class="primary" title="Pick the browser window once. The picture then follows whichever tab you are on.">Share this browser window</button>
      <button id="mic" title="Allow the microphone for the extension (one time)">Allow microphone</button>
    </div>
    <div id="perm" class="chips"></div>
    <div id="help" class="help" hidden>
      <div id="helptext"></div>
      <div class="row">
        <button id="helpallow" class="primary">Ask again</button>
        <button id="helpedge">Edge microphone settings</button>
        <a id="helpwin" class="btn" href="ms-settings:privacy-microphone" target="_blank">Windows microphone settings</a>
      </div>
    </div>
  </section>

  <section>
    <h2>2 · Record</h2>
    <div class="row">
      <button id="start" class="rec">Start</button>
      <button id="pause" title="Pause and resume (the paused time is cut from the video)">Pause</button>
      <button id="stop">Stop</button>
      <button id="mute">Mic on/off</button>
    </div>
  </section>

  <section>
    <h2>3 · Annotate the page in front</h2>
    <div class="row" id="tools">
      <button data-tool="select" title="Select and move (V). Delete removes">⬚ Select</button>
      <button data-tool="pen" title="Pen (B)">✏️ Pen</button>
      <button data-tool="highlighter" title="Highlighter (H)">🖍 Highlight</button>
      <button data-tool="line" title="Line (L), Shift snaps">╱ Line</button>
      <button data-tool="arrow" title="Arrow (A), Shift snaps">➚ Arrow</button>
      <button data-tool="rect" title="Rectangle (R)">▭ Box</button>
      <button data-tool="ellipse" title="Ellipse (O)">◯ Circle</button>
      <button data-tool="text" title="Text (T): click, type, Enter">T Text</button>
      <button data-tool="marker" title="Numbered marker (M)">① Marker</button>
      <button data-tool="eraser" title="Eraser (E): click a shape">⌫ Erase</button>
    </div>
    <div class="row" id="colors"></div>
    <label class="row size">Size <input id="size" type="range" min="2" max="14" value="4"><span id="sizev">4</span></label>
    <div class="row">
      <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <button id="clear" title="Esc">Clear all, go live</button>
    </div>
  </section>

  <div id="status">…</div>
  <div id="err"></div>
  <section>
    <h2>Saved videos</h2>
    <div id="folder" class="folder">Folder: …</div>
    <div class="row"><button id="openfolder">Open folder</button><button id="copyfolder">Copy path</button></div>
    <ul id="files"></ul>
  </section>
  <script src="sidepanel.js"></script>
</body>
</html>
